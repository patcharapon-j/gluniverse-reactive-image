name: Release Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update module.json version
        run: |
          cd foundry-module
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Package module as zip
        run: |
          cd foundry-module
          zip -r ../gluniverse-reactive-image.zip . -x ".*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gluniverse-reactive-image.zip
            foundry-module/module.json
          generate_release_notes: true
