services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - uploads:/app/public/uploads
      - ./config.json:/app/config.json
    restart: unless-stopped

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - webapp
    restart: unless-stopped

volumes:
  uploads:
